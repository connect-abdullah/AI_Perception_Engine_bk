[tool.poetry]
name = "ai-perception-engine"
version = "0.1.0"
description = "AI Perception Engine – PostgreSQL schema, SQLAlchemy models, and FastAPI health layer"
authors = []
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = { version = "^0.30.0", extras = ["standard"] }
sqlalchemy = "^2.0.0"
psycopg = { version = "^3.2.0", extras = ["binary"] }
alembic = "^1.13.0"
pydantic-settings = "^2.4.0"
python-dotenv = "^1.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
httpx = "^0.27.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
